name: Refrio API quality gates
on:
  push:
    branches: [main, develop, 'feature/**', 'release/**']
  pull_request:
permissions:
  contents: read
jobs:
  domain-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Eight bounded contexts are present
        run: python3 scripts/check_ddd_structure.py
      - name: Compile pure domain and run invariant checks
        run: python3 scripts/verify_domain.py
      - name: Compile and execute JUnit + H2 integration tests
        run: ./mvnw -B clean verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refrio-surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
      - name: Build application container
        run: docker build -t refrio-backend:ci .

  postgres-migration-and-http:
    needs: domain-and-tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: refrio
          POSTGRES_USER: refrio
          POSTGRES_PASSWORD: ci_only_pass
        options: >-
          --health-cmd "pg_isready -U refrio -d refrio"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Package app
        run: ./mvnw -B -DskipTests package
      - name: Launch Java app and migrate Postgres schema
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/refrio
          DB_USER: refrio
          DB_PASSWORD: ci_only_pass
          JWT_SECRET: ci-only-test-signing-key-with-over-32-chars-0123456789
          BOOTSTRAP_ADMIN_USERNAME: admin-ci
          BOOTSTRAP_ADMIN_PASSWORD: CI-Admin-Password-12345
          CORS_ORIGINS: http://localhost:4200
          SEED_DEMO: 'true'
          DEMO_RETAIL_PASSWORD: CI-Retail-Strong-Password-12345
          EXTERNAL_WEATHER_ENABLED: 'false'
        run: |
          set -euo pipefail
          java -jar target/refrio-backend-1.1.0.jar > application.log 2>&1 &
          for i in $(seq 1 90); do
            if curl --fail --silent http://localhost:8080/actuator/health > health.json; then
              break
            fi
            sleep 2
          done
          curl --fail --silent http://localhost:8080/actuator/health > health.json
          curl --fail --silent http://localhost:8080/v3/api-docs > openapi.json
          python3 - <<'PY_CHECK'
          import json
          health=json.load(open('health.json'))
          assert health['status']=='UP', health
          docs=json.load(open('openapi.json'))
          assert '/api/v1/operations/shipments' in docs['paths'], docs['paths'].keys()
          assert '/api/v1/operations/weather' in docs['paths']
          import urllib.request
          def post_login(username,password):
              payload=json.dumps({'username':username,'password':password}).encode()
              request=urllib.request.Request('http://localhost:8080/api/session',data=payload,
                  headers={'Content-Type':'application/json'},method='POST')
              with urllib.request.urlopen(request,timeout=5) as response:
                  return json.load(response)['token']
          admin_token=post_login('admin-ci','CI-Admin-Password-12345')
          retailer_token=post_login('bodega-demo','CI-Retail-Strong-Password-12345')
          request=urllib.request.Request('http://localhost:8080/api/session',headers={'Authorization':'Bearer '+retailer_token})
          with urllib.request.urlopen(request,timeout=5) as response:
              retailer=json.load(response)
          request=urllib.request.Request('http://localhost:8080/api/operations',headers={'Authorization':'Bearer '+admin_token})
          with urllib.request.urlopen(request,timeout=5) as response:
              operations=json.load(response)
          assert retailer['role']=='Minorista'
          assert any(c.get('recipientId')==str(retailer['id']) for c in operations['clients'])
          with open('integration-check.json','w') as stream:
              json.dump({'status':'PASS','retail-role':'Minorista','demo-client-linked':True},stream)
          print('HEALTH + OPENAPI + AUTH + DEMO USER LINK + POSTGRES MIGRATION: OK')
          PY_CHECK
      - name: Upload actual runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-and-openapi-evidence
          path: |
            application.log
            health.json
            openapi.json
            integration-check.json
          if-no-files-found: ignore
