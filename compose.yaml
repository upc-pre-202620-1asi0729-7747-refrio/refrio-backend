services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: refrio
      POSTGRES_USER: refrio
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Create .env with DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U refrio -d refrio"]
      interval: 5s
      retries: 15
    volumes:
      - refrio_db:/var/lib/postgresql/data
  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/refrio
      DB_USER: refrio
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4200}
      SEED_DEMO: ${SEED_DEMO:-false}
      DEMO_RETAIL_PASSWORD: ${DEMO_RETAIL_PASSWORD:-}
      ALLOW_PUBLIC_SUPERVISOR_SIGNUP: ${ALLOW_PUBLIC_SUPERVISOR_SIGNUP:-false}
      EXTERNAL_WEATHER_ENABLED: ${EXTERNAL_WEATHER_ENABLED:-true}
      EXTERNAL_WEATHER_BASE_URL: ${EXTERNAL_WEATHER_BASE_URL:-https://api.open-meteo.com}
volumes:
  refrio_db:
