spring:
  datasource:
    url: jdbc:h2:mem:refrio;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
app:
  security:
    jwt-secret: test-only-key-with-more-than-thirty-two-bytes-xxxxxxxx
  bootstrap:
    allow-supervisor-registration: true

  external:
    weather:
      enabled: false
